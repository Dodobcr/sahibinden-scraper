name: Sahibinden Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagımlılıkları yukle
        run: pip install -r requirements.txt

      - name: Chrome ve xvfb kur
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: Scraper calistir
        env:
          SAH_URLS:     ${{ secrets.SAH_URLS }}
          MAX_LISTINGS: "20"
          MAX_PAGES:    "50"
        run: python scraper.py

      - name: Sonuclari repoya kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in ilanlar.csv ilanlar.xlsx seen.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet && echo "Degisiklik yok." || \
            git commit -m "Guncelleme $(date '+%Y-%m-%d %H:%M') - ${{ env.NEW_COUNT }} yeni ilan"
          git push
